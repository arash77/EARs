name: The EARs Reviewing bot for assigning reviewer after supervisor approval

on:
  schedule:
    # Every hour, Monday to Friday, 07:00-15:00 UTC: covers 9:00-17:00 Berlin
    # time in winter and in summer (cron is UTC). The bot itself only posts in
    # office hours (in_office_hours() in ear_bot_reviewer.py).
    - cron: "0 7-15 * * 1-5"

  workflow_dispatch:  # TEST ONLY inputs
    inputs:
      office:
        default: ""
      stale_min:
        default: ""

concurrency:
  group: ear-bot-scheduled
  cancel-in-progress: false

permissions: {}

jobs:
  find-reviewer:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: 917566
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: "arash77"
          repositories: "EARs"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "test/new-ear-bot-v4"
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv pip install --system -r ear_bot/requirements.txt

      - name: Run python script to find a reviewer
        env:
          GITHUB_APP_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TEST_OFFICE: ${{ inputs.office }}
          TEST_STALE_MIN: ${{ inputs.stale_min }}
        run: python -u ear_bot/ear_bot_reviewer.py --search
